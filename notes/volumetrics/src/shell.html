<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volumetrics Video</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<!--KATEX_CSS-->
<style>
/* One look, manim's: a black 1080p stage, everything on it in Computer Modern (KaTeX's fonts).
   Layout: title and scene tabs, the 16:9 stage, then the open scene's animations and parameters. */
:root {
  color-scheme: dark;
  --bg: #000000; --raise: #141414; --line: #262626; --line2: #3A3A3A;
  --fg: #FFFFFF; --fg2: #C9C9C9; --muted: #8C8C8C;
  --blue: #58C4DD; --yellow: #F4D06F;
  --cm: KaTeX_Main, 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
#app {
  height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--cm); font-weight: 400; font-size: 24px; line-height: 1.1; white-space: nowrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  font: inherit; font-size: 13px; cursor: pointer; color: var(--fg2); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 5px; display: inline-flex; gap: 7px; align-items: baseline; white-space: nowrap;
}
.tab .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tab:hover { color: var(--fg); border-color: var(--line2); }
.tab[aria-selected="true"] { color: #000; background: var(--fg); border-color: var(--fg); }
.tab[aria-selected="true"] .n { color: #666; }
.tab sup { font-size: 0.72em; line-height: 0; }
.hint { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--fg2); }

.stagewrap { min-height: 0; container-type: size; display: grid; place-items: center; }
.stage { position: relative; width: min(100cqw, 100cqh * 16 / 9); aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage.grab { cursor: grab; }
.stage.grabbing { cursor: grabbing; }

.ctl { display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.anims { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--fg); background: var(--raise);
  border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; white-space: nowrap;
}
.btn:hover { border-color: #5E5E5E; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #000; }
.btn.quiet { background: transparent; color: var(--fg2); }
.btn:focus-visible, .tab:focus-visible, select:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.stepinfo { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 0 4px; }
.glob { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.params { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: end; color: var(--fg2); }
.rng { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; width: 190px; }
.rng output { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
.rng input { grid-column: 1 / -1; width: 100%; accent-color: var(--blue); margin: 4px 0 0; }
.sel, .txt { display: grid; gap: 3px; }
select, .txt input {
  font: inherit; font-size: 12.5px; color: var(--fg); background: var(--raise); border: 1px solid var(--line2); border-radius: 7px; padding: 4px 8px;
}
.txt input { font-family: var(--mono); width: 200px; }
.txt.wide input { width: min(560px, 82vw); }
.chk { display: flex; gap: 7px; align-items: center; padding-bottom: 4px; cursor: pointer; }
.chk input { accent-color: var(--blue); margin: 0; }
.chips { display: flex; gap: 6px; align-items: center; }
.chip { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line2); cursor: pointer; padding: 0; }
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px #000 inset; }
.chips input[type="color"] { width: 30px; height: 24px; padding: 0 2px; border: 1px solid var(--line2); border-radius: 6px; background: var(--raise); }
.note { margin: 0; max-width: 560px; color: var(--muted); font-size: 12px; line-height: 1.45; padding-bottom: 3px; }
.note code { font-family: var(--mono); color: var(--fg2); }
@media (max-width: 760px) { .hint { display: none; } .glob { margin-left: 0; } }

/* Recording: H (or Hide controls) leaves only the stage, letterboxed in the window. */
body.clean #app { grid-template-rows: minmax(0, 1fr); padding: 0; }
body.clean .bar, body.clean .ctl { display: none; }
body.clean .stage { border: 0; border-radius: 0; }
#showBtn { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); opacity: 0; transition: opacity .2s; }
#showBtn:hover, #showBtn:focus-visible { opacity: 1; }
/* KaTeX lays formulas out here, out of sight; the canvas draws them. */
#texHost { position: fixed; left: 0; top: 0; font-size: 100px; color: #fff; white-space: nowrap; pointer-events: none; opacity: 0; z-index: -1; }
#texHost .texbox { position: absolute; left: 0; top: 0; }
</style>

<div id="app">
  <header class="bar">
    <h1>Volumetrics video</h1>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Scenes"></nav>
    <span class="hint"><kbd>1</kbd>–<kbd>9</kbd> scene · <kbd>Space</kbd> play · <kbd>R</kbd> reset · <kbd>←</kbd><kbd>→</kbd> steps · <kbd>H</kbd> hide controls · <kbd>F</kbd> full screen</span>
  </header>
  <main class="stagewrap"><div class="stage" id="stage"><canvas id="cv" aria-label="Animation stage"></canvas></div></main>
  <footer class="ctl">
    <div class="row1">
      <div class="anims" id="anims" role="group" aria-label="Animations"></div>
      <div class="glob">
        <label for="speed">Speed</label>
        <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button class="btn quiet" id="hideBtn" type="button">Hide controls</button>
        <button class="btn quiet" id="fsBtn" type="button">Full screen</button>
      </div>
    </div>
    <div class="params" id="params"></div>
  </footer>
</div>
<button class="btn" id="showBtn" type="button" hidden>Show controls</button>
<div id="texHost" aria-hidden="true"></div>
<!--KATEX_JS-->
<!--APP_JS-->
